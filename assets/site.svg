<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Browser loading abhi-420bytes.github.io — Challa Abhiram's portfolio">
  <title>abhi-420bytes.github.io — my portfolio</title>
  <defs>
    <linearGradient id="chr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#232329"/><stop offset="100%" stop-color="#1a1a20"/>
    </linearGradient>
    <linearGradient id="ld" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7a1a"/><stop offset="100%" stop-color="#ffb060"/>
    </linearGradient>
    <radialGradient id="wash" cx="0.5" cy="0.18" r="0.75">
      <stop offset="0%" stop-color="#ff7a1a" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.045"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="wc"><rect x="16" y="16" width="968" height="438" rx="14"/></clipPath>
    <clipPath id="uclipPath"><rect id="uclip" x="176" y="28" width="172" height="22"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .sans { font-family: "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .serif{ font-family: "DM Serif Display", Georgia, "Times New Roman", serif; }
      #shell { animation: fade 14s ease-in-out infinite; }
      @keyframes fade { 0%,1% {opacity:0} 3%,93% {opacity:1} 98%,100% {opacity:0} }
      #uclip { transform-origin: 176px 0; animation: type 14s steps(23,end) infinite; }
      @keyframes type { 0%,4% {transform:scaleX(0)} 15%,100% {transform:scaleX(1)} }
      #ucur { animation: cur 14s steps(23,end) infinite, curvis 14s steps(1,end) infinite; }
      @keyframes cur { 0%,4% {transform:translateX(0)} 15%,100% {transform:translateX(172px)} }
      @keyframes curvis { 0%,3.9% {opacity:0} 4%,16% {opacity:1} 16.1%,100% {opacity:0} }
      #bar { transform-origin: 16px 0; animation: load 14s cubic-bezier(.3,.9,.4,1) infinite; }
      @keyframes load { 0%,15% {transform:scaleX(0); opacity:1} 21% {transform:scaleX(1); opacity:1} 24%,100% {transform:scaleX(1); opacity:0} }
      #page { animation: paint 14s ease-out infinite; }
      @keyframes paint { 0%,20% {opacity:0} 25%,100% {opacity:1} }
      #hero { animation: rise 14s cubic-bezier(.2,.8,.2,1) infinite; }
      @keyframes rise { 0%,24% {opacity:0; transform:translateY(14px)} 31%,100% {opacity:1; transform:translateY(0)} }
      #cta { animation: rise2 14s cubic-bezier(.2,.8,.2,1) infinite; }
      @keyframes rise2 { 0%,30% {opacity:0; transform:translateY(10px)} 36%,100% {opacity:1; transform:translateY(0)} }
      #ptr { animation: glide 14s cubic-bezier(.4,0,.2,1) infinite; }
      @keyframes glide { 0%,40% {opacity:0; transform:translate(300px,90px)} 44% {opacity:1} 56%,100% {opacity:1; transform:translate(0,0)} }
      #ripple { transform-origin: 452px 402px; animation: rip 14s ease-out infinite; }
      @keyframes rip { 0%,57% {transform:scale(.2); opacity:0} 58% {opacity:.55} 66%,100% {transform:scale(2.6); opacity:0} }
      #btnGlow { animation: bg 14s ease-in-out infinite; }
      @keyframes bg { 0%,57% {opacity:0} 60% {opacity:1} 72% {opacity:.35} 84% {opacity:1} 96%,100% {opacity:.35} }
      #p0 { transform-origin: 125px 166px; animation: pop0 14s cubic-bezier(.34,1.56,.64,1) infinite; }
      @keyframes pop0 { 0%,25.0% {opacity:0; transform:scale(.7)} 27.4%,100% {opacity:1; transform:scale(1)} }
      #p1 { transform-origin: 295px 146px; animation: pop1 14s cubic-bezier(.34,1.56,.64,1) infinite; }
      @keyframes pop1 { 0%,26.4% {opacity:0; transform:scale(.7)} 28.799999999999997%,100% {opacity:1; transform:scale(1)} }
      #p2 { transform-origin: 475px 138px; animation: pop2 14s cubic-bezier(.34,1.56,.64,1) infinite; }
      @keyframes pop2 { 0%,27.8% {opacity:0; transform:scale(.7)} 30.2%,100% {opacity:1; transform:scale(1)} }
      #p3 { transform-origin: 652px 148px; animation: pop3 14s cubic-bezier(.34,1.56,.64,1) infinite; }
      @keyframes pop3 { 0%,29.2% {opacity:0; transform:scale(.7)} 31.599999999999998%,100% {opacity:1; transform:scale(1)} }
      #p4 { transform-origin: 812px 168px; animation: pop4 14s cubic-bezier(.34,1.56,.64,1) infinite; }
      @keyframes pop4 { 0%,30.6% {opacity:0; transform:scale(.7)} 33.0%,100% {opacity:1; transform:scale(1)} }
      #p5 { transform-origin: 142px 214px; animation: pop5 14s cubic-bezier(.34,1.56,.64,1) infinite; }
      @keyframes pop5 { 0%,32.0% {opacity:0; transform:scale(.7)} 34.4%,100% {opacity:1; transform:scale(1)} }
      #p6 { transform-origin: 342px 204px; animation: pop6 14s cubic-bezier(.34,1.56,.64,1) infinite; }
      @keyframes pop6 { 0%,33.4% {opacity:0; transform:scale(.7)} 35.8%,100% {opacity:1; transform:scale(1)} }
      #p7 { transform-origin: 732px 206px; animation: pop7 14s cubic-bezier(.34,1.56,.64,1) infinite; }
      @keyframes pop7 { 0%,34.8% {opacity:0; transform:scale(.7)} 37.199999999999996%,100% {opacity:1; transform:scale(1)} }
      #p8 { transform-origin: 885px 220px; animation: pop8 14s cubic-bezier(.34,1.56,.64,1) infinite; }
      @keyframes pop8 { 0%,36.2% {opacity:0; transform:scale(.7)} 38.6%,100% {opacity:1; transform:scale(1)} }
      @media (prefers-reduced-motion: reduce) {
        #shell,#uclip,#ucur,#bar,#page,#hero,#cta,#ptr,#ripple,#btnGlow,#p0,#p1,#p2,#p3,#p4,#p5,#p6,#p7,#p8 { animation: none !important; }
        #shell,#page,#hero,#cta,#p0,#p1,#p2,#p3,#p4,#p5,#p6,#p7,#p8 { opacity:1 !important; transform:none !important; }
        #uclip { transform:scaleX(1) !important; }
        #ucur,#bar,#ripple { opacity:0 !important; } #btnGlow { opacity:.5 !important; }
      }
    </style>
