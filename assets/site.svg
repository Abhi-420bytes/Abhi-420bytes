        </text>
        <text x="500" y="352" text-anchor="middle" class="sans" font-size="13.5" font-weight="600" fill="#d4d4d8">Full-Stack &amp; AI Developer</text>
        <text x="500" y="372" text-anchor="middle" class="sans" font-size="11" fill="#8b8b94">CS undergraduate at Amrita · former Data Scientist Intern at AiSPRY</text>
