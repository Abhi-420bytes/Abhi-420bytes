    <circle cx="44" cy="39" r="6.5" fill="#ff5f57"/><circle cx="66" cy="39" r="6.5" fill="#febc2e"/><circle cx="88" cy="39" r="6.5" fill="#28c840"/>
    <path d="M118 33 l-7 6 7 6" fill="none" stroke="#6b6b75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="140" y="26" width="560" height="26" rx="13" fill="#0d0d11" stroke="#2b2b33"/>
    <path d="M157 36 v-2.5 a3.4 3.4 0 0 1 6.8 0 V36" fill="none" stroke="#7ee787" stroke-width="1.5"/>
    <rect x="155.5" y="35.5" width="9.8" height="8" rx="1.8" fill="#7ee787"/>
    <g clip-path="url(#uclipPath)">
