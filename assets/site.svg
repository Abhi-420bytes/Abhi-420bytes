      <text x="84" y="98" class="sans" font-size="12.5" font-weight="700" fill="#f5f5f4">Challa Abhiram</text>
      <text x="84" y="110" class="sans" font-size="9.5" fill="#7a7a83">Full-Stack &amp; AI/ML</text>
        <text x="556" y="101" class="sans" font-size="11.5" fill="#8b8b94">About</text>
        <text x="614" y="101" class="sans" font-size="11.5" fill="#8b8b94">Skills</text>
