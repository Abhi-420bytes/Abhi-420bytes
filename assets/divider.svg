<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 10" width="1000" height="10" role="img" aria-label="divider">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7ee787" stop-opacity="0.15"/>
      <stop offset="35%"  stop-color="#56d4dd" stop-opacity="0.55"/>
      <stop offset="70%"  stop-color="#79c0ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d2a8ff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bar"><rect x="0" y="4" width="1000" height="3" rx="1.5"/></clipPath>
    <style>
      #glide { animation: glide 5s linear infinite; }
      @keyframes glide { 0% {transform:translateX(-260px)} 100% {transform:translateX(1000px)} }
      @media (prefers-reduced-motion: reduce) { #glide { animation: none; opacity: 0; } }
    </style>
  </defs>
  <rect x="0" y="4" width="1000" height="3" rx="1.5" fill="url(#base)"/>
  <g clip-path="url(#bar)"><rect id="glide" x="0" y="4" width="260" height="3" fill="url(#pulse)"/></g>
</svg>
